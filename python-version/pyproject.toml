[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "experiment-planner"
version = "0.1.0"
description = "本地实验规划助手 — Python 源码版"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2", "scipy>=1.13", "ax-platform==1.3.1", "botorch==0.18.1", "torch>=2.8", "PySide6>=6.8,<7", "matplotlib>=3.9", "openpyxl>=3.1", "filelock>=3.16"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
experiment-planner = "experiment_planner.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
experiment_planner = ["resources/templates/*.json", "resources/fonts/*.ttc", "resources/fonts/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["model: real model fitting integration", "gui: offscreen Qt prototype"]
