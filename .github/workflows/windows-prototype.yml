name: Windows prototype validation
on:
  workflow_dispatch:
  push:
    branches: ['codex/windows-prototype-*']
  pull_request:
    paths: ['src/**', 'tests/**', 'packaging/**', 'requirements/**', 'pyproject.toml', '.github/workflows/windows-prototype.yml']
permissions:
  contents: read
jobs:
  prototype:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install candidate CPU dependencies
        shell: pwsh
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { throw 'CPU torch installation failed' }
          python -m pip install -r requirements/windows.in
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          python -m pip install --no-deps -e .
          if ($LASTEXITCODE -ne 0) { throw 'Application installation failed' }
      - name: Test, freeze and run packaged synthetic loop
        shell: pwsh
        run: ./packaging/windows/build.ps1
      - name: Upload prototype and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-prototype-evidence
          path: |
            dist/*.zip
            dist/SHA256.txt
            dist/frozen-evidence.json
            windows-tests.xml
            requirements/windows-resolved.txt
            build/ExperimentPlanner/warn-ExperimentPlanner.txt
          retention-days: 14
